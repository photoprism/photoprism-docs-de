# Configuration for the "typos" spell checker, run via "make spellcheck".
#
# typos only reports words that appear in its curated typo list, so unknown words are assumed
# to be correct. That is what makes it usable on German prose: it does not dictionary-check,
# so ordinary German words pass untouched. What it does need is an exception whenever a German
# word happens to collide with an entry in its English typo list — those are listed below and
# are the only German-specific difference from the English repo's configuration.
#
# See https://github.com/crate-ci/typos for the full configuration reference.

[files]
extend-exclude = [
  "site/",
  "venv/",
  "bin/",
]

[default.extend-words]
# File extensions and format names that look like misspelled words.
thm = "thm"   # .thm thumbnail sidecar files
THM = "THM"
pn = "pn"     # .pn (Portable Network Graphics variant), and the "PN" in "PNGs"
PN = "PN"

# Parts of build version strings, commit hashes, and IDs used as examples.
ba = "ba"     # e.g. build 210208-9e10ba69
dbe = "dbe"   # e.g. build 260520-12dbe82d3

# Personal names of contributors and cited authors.
Mathes = "Mathes"   # Heiko Mathes
Wirth = "Wirth"     # Niklaus Wirth

# --- German vocabulary that collides with the English typo corpus -------------------
#
# typos ships an English typo list, so ordinary German words are occasionally read as
# misspelled English ones ("ist" -> "is", "oder" -> "order"). Every entry below is a correct
# German word, generated by running the checker over docs/ and accepting what it flagged.
# This is the whole German-specific difference from the English repo's configuration.
#
# Adding to this list is expected when new German vocabulary appears. Do NOT add a word here
# without checking it really is correct German — that is the one thing the list can hide.
Adresse = "Adresse"
Aktion = "Aktion"
aktive = "aktive"
